command_timeout = 200

[fill]
symbol = ' '
#style = 'bold green'

[time]
disabled = false
format = "[󰥔 $time](bold #a80ebc)"
time_format = "%H:%M:%S"  # 24小时制

[character]
success_symbol = '[➜](bold green) '
error_symbol = '[➜](bold red) '

[directory]
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
format = "[󰉋 $path ](bold cyan)"


[aws]
symbol = "  "

[[battery.display]] # 'bold red' style and discharging_symbol when capacity is between 0% and 10%
threshold = 10
style = 'bold red'

[[battery.display]] # 'bold yellow' style and 💦 symbol when capacity is between 10% and 30%
threshold = 30
style = 'bold yellow'
discharging_symbol = '💦 '

[buf]
symbol = " "

